version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: inventario_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${INVENTARIO_DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${INVENTARIO_DB_NAME:-inventario}
      MYSQL_USER: ${INVENTARIO_DB_USER:-inventario_user}
      MYSQL_PASSWORD: ${INVENTARIO_DB_PASSWORD:-changeme}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./inventario.sql:/docker-entrypoint-initdb.d/inventario.sql
    ports:
      - "3306:3306"
    networks:
      - inventario_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: inventario_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      INVENTARIO_SECRET_KEY: ${INVENTARIO_SECRET_KEY}
      INVENTARIO_COOKIE_SECURE: ${INVENTARIO_COOKIE_SECURE:-0}
      INVENTARIO_DB_HOST: db
      INVENTARIO_DB_PORT: 3306
      INVENTARIO_DB_NAME: ${INVENTARIO_DB_NAME:-inventario}
      INVENTARIO_DB_USER: ${INVENTARIO_DB_USER:-inventario_user}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:-changeme}
      INVENTARIO_ADMIN_EMAIL: ${INVENTARIO_ADMIN_EMAIL}
      INVENTARIO_ADMIN_PASSWORD: ${INVENTARIO_ADMIN_PASSWORD}
      INVENTARIO_ADMIN_NAME: ${INVENTARIO_ADMIN_NAME:-Administrador}
      INVENTARIO_ADMIN_LASTNAME: ${INVENTARIO_ADMIN_LASTNAME:-Principal}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/imagenes:/app/backend/imagenes
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventario_network

volumes:
  mysql_data:

networks:
  inventario_network:
    driver: bridge
